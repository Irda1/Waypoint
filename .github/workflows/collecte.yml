name: Collecte de données

# Remplit la base Supabase (pays, villes, lieux, images) depuis des sources
# officielles ou ouvertes. Tourne sur GitHub : ton ordinateur n'a pas besoin
# d'être allumé. Secrets à créer dans Settings > Secrets and variables > Actions :
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, PEXELS_API_KEY (pour les images)

on:
  workflow_dispatch:
    inputs:
      pass:
        description: "Passe à lancer"
        type: choice
        options: [queue, countries, cities, places, images]
        default: queue
      country:
        description: "Villes : code pays ISO à charger (ex. PT). Vide = tous les pays"
        required: false
      city:
        description: "Lieux : identifiant de la ville en base (ex. 12)"
        required: false
      max:
        description: "File / images : nombre maximum de tâches"
        required: false
        default: "3"
      dry_run:
        description: "Simulation : lit et trie, n'écrit rien"
        type: boolean
        default: false
  schedule:
    # Traite les villes demandées par l'app (file d'attente), toutes les 3 heures
    - cron: "17 */3 * * *"

permissions:
  contents: read

# Un seul flux à la fois : jamais deux collectes en parallèle (ni deux jobs
# qui se disputent le quota Overpass ou Pexels).
concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    # Les exécutions planifiées ne démarrent qu'une fois la variable de dépôt
    # COLLECTE_ACTIVE = true créée (Settings > Secrets and variables > Actions > Variables) :
    # pas d'échecs en boucle tant que les secrets ne sont pas configurés.
    if: ${{ github.event_name != 'schedule' || vars.COLLECTE_ACTIVE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Tests du pipeline
        run: node --test pipeline/test/*.test.mjs

      - name: Collecte
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # Saisies passées par variables d'environnement (jamais collées dans le script)
          PASS: ${{ inputs.pass || 'queue' }}
          COUNTRY: ${{ inputs.country }}
          CITY: ${{ inputs.city }}
          MAX: ${{ inputs.max || '3' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Secrets SUPABASE_URL et SUPABASE_SERVICE_ROLE_KEY manquants (voir docs/BACKEND.md)."
            exit 1
          fi
          args=("$PASS")
          case "$PASS" in
            cities)  [ -n "$COUNTRY" ] && args+=(--country "$COUNTRY") ;;
            places)  [ -n "$CITY" ] || { echo "::error::La passe places demande l'identifiant de la ville (champ city)."; exit 1; }
                     args+=(--city "$CITY") ;;
            images|queue) args+=(--max "$MAX") ;;
          esac
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          node pipeline/src/cli.mjs "${args[@]}"
