# Vérifications automatiques de chaque PR (et de main) : tests et typage de l'appli, parcours dans un navigateur,
# tests de la collecte, all-migrations.sql à jour, schéma et sécurité (RLS) de la base sur un PostgreSQL jetable.
# Aucun secret utilisé. Une PR dont une vérification échoue s'affiche en rouge : on corrige avant de fusionner.
name: Vérifications

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appli:
    name: Appli (tests et typage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/expo/package-lock.json

      - name: Installer les dépendances
        working-directory: apps/expo
        run: npm install --no-audit --no-fund

      - name: Tests du domaine
        working-directory: apps/expo
        run: npm test

      - name: Typage
        working-directory: apps/expo
        run: npm run typecheck

  parcours:
    name: Parcours dans le navigateur
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/expo/package-lock.json

      - name: Installer les dépendances
        working-directory: apps/expo
        run: npm install --no-audit --no-fund

      - name: Navigateur Chromium
        working-directory: apps/expo
        run: npx playwright install --with-deps chromium

      # Site construit avec une fausse adresse Supabase : chaque test simule lui-même le serveur (aucun secret, aucune vraie base).
      - name: Parcours (connexion, accueil, programme, onglet Jour, réservations, partage)
        working-directory: apps/expo
        run: npx playwright test

      - name: Captures des parcours en échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parcours-echecs
          path: apps/expo/test-results
          retention-days: 7

  base:
    name: Collecte, SQL et sécurité de la base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Tests de la collecte et des fonctions du serveur
        run: node --test pipeline/test/*.test.mjs supabase/functions/*/*.test.ts

      - name: all-migrations.sql à jour
        run: node scripts/bundle-sql.mjs --check

      - name: PostgreSQL (déjà présent sur les machines GitHub, sinon installé)
        run: ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y postgresql)

      - name: Schéma et sécurité de la base (PostgreSQL jetable)
        run: bash supabase/tests/run-local.sh
