<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Waypoint</title>
<style>
html,body{margin:0;height:100%;background:var(--bg,#000);overflow:hidden}
canvas{display:block;width:100%;height:100%}
.lab{position:absolute;left:0;top:0;padding:3px 8px;border-radius:999px;font:600 12px/1.2 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .4s}
</style></head><body>
<canvas id="c"></canvas>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
(function () {
  "use strict";
  var q = new URLSearchParams(location.search), G = window.__GLOBE__ || {};
  var COLOR = "#" + String(G.color || q.get("color") || "FFB95A").replace("#", "");
  var DAY = (G.theme || q.get("theme")) === "jour";
  var TRIP = String(G.route || q.get("route") || "").split(";").map(function (s) { var f = s.split(","), v = [Number(f[0]), Number(f[1])]; return f.length >= 2 && isFinite(v[0]) && isFinite(v[1]) && Math.abs(v[1]) <= 90 ? [v[0], v[1], (f[2] || "").slice(0, 40)] : null; }).filter(Boolean).slice(0, 30);
  var TRIPV = TRIP.length > 0;
  var BG = DAY ? "#F1E4CC" : "#000000";
  document.documentElement.style.setProperty("--bg", BG);
  if (!window.THREE) return;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var canvas = document.getElementById("c");
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  var scene = new THREE.Scene(); scene.background = new THREE.Color(BG);
  var camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
  var group = new THREE.Group(); scene.add(group);
  // Cadrage : sur téléphone la planète occupe le haut du bandeau (le texte de l'accueil est en bas) ;
  // sur grand écran elle se place à droite, le texte reste à gauche.
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    // Même calcul que routeFrame() côté appli (constantes partagées).
    var wide = w / h > 1.1, z = wide ? 10 : 12.5, halfW = Math.tan(18 * Math.PI / 180) * z * (w / h);
    camera.position.set(0, 0, z); camera.lookAt(0, 0, 0);
    group.position.set(wide ? Math.min(halfW - 2.4, 4.2) : 0.7, wide ? 0 : 1.55, 0);
    if (TRIPV) {
      W0 = w; H0 = h; zCur = reduce ? zFor(VIEW) : (zCur || zFor(VIEWF)); place(zCur); z = zCur;
      // Voile de la couleur du fond derrière le texte de l'écran : en bas sur téléphone, à gauche sur grand écran.
      veil.style.background = "linear-gradient(" + (wide ? "to right" : "to top") + "," + BG + "f2 0%," + BG + "cc " + (wide ? "36%" : "30%") + "," + BG + "00 " + (wide ? "68%" : "62%") + ")";
    }
    if (sun) { var hh = Math.tan(18 * Math.PI / 180) * (z + 30); sun.position.set(hh * (w / h) * 0.92, hh * 0.86, -30); }
    camera.updateProjectionMatrix(); draw();
  }

  // Itinéraire : distance de la caméra pour une demi-hauteur de vue donnée ; le point regardé se place à droite
  // sur grand écran, dans le haut sur téléphone (le texte de l'écran garde sa place).
  var zCur = 0, W0 = 1, H0 = 1, veil = document.createElement("div");
  if (TRIPV) { veil.style.cssText = "position:absolute;inset:0;pointer-events:none"; document.body.appendChild(veil); }
  function zFor(v) { return Math.min(8.5, 2 + v / (Math.tan(18 * Math.PI / 180) * Math.min(1, W0 / H0))); }
  function place(z) {
    camera.position.set(0, 0, z); camera.lookAt(0, 0, 0);
    var hs = Math.tan(18 * Math.PI / 180) * (z - 2), wide = W0 / H0 > 1.1;
    group.position.set(wide ? 0.45 * hs * (W0 / H0) : 0, wide ? 0 : 0.42 * hs, 0);
  }

  function vec(lon, lat, r) { var phi = (90 - lat) * Math.PI / 180, th = (lon + 180) * Math.PI / 180; return new THREE.Vector3(-r * Math.sin(phi) * Math.cos(th), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(th)); }

  // Villes du tracé : celles du voyage, sinon un tour du monde de démonstration (accueil).
  var CITIES = TRIP.length ? TRIP : [[2.35, 48.86], [-9.14, 38.72], [-73.99, 40.73], [-43.2, -22.9], [18.42, -33.92], [55.27, 25.2], [100.5, 13.75], [139.69, 35.69], [151.21, -33.87]];
  // Centre du parcours et son étendue (angle max depuis le centre) : servent au cadrage et au zoom de la carte d'itinéraire.
  var mid = new THREE.Vector3(); CITIES.forEach(function (c) { mid.add(vec(c[0], c[1], 1)); });
  if (mid.lengthSq() < 1e-6) mid.set(0, 0, 1); mid.normalize();
  var SPAN = CITIES.reduce(function (m, c) { return Math.max(m, vec(c[0], c[1], 1).angleTo(mid)); }, 0);
  // Demi-hauteur de vue utile (en unités, planète de rayon 2) et taille relative des repères lumineux.
  // VIEW : vue d'ensemble du trajet ; VIEWF : gros plan qui suit le point.
  var VIEW = TRIPV ? Math.max(2 * Math.sin(Math.min(SPAN, 1.2)) * 2.2, 0.2) : 2, VIEWF = TRIPV ? Math.max(0.2, Math.min(VIEW * 0.45, 1.2)) : 2;
  var K = TRIPV ? Math.max(0.25, Math.min(1, VIEWF / 1.2)) : 1;
  // Terres plus finement pointillées autour d'un parcours régional (pas de 0,35° au lieu de 1,35°).
  var FINE = TRIPV && SPAN < 0.35;

  // Nuit : ciel étoilé et halo de soleil discret dans le coin haut droit (placé au redimensionnement).
  var sun = null;
  if (!DAY) {
    var NS = 900, sp = new Float32Array(NS * 3);
    for (var si = 0; si < NS; si++) { var u = Math.random() * 2 - 1, th = Math.random() * 6.2832, rr = Math.sqrt(1 - u * u), d = 55 + Math.random() * 25; sp[si * 3] = d * rr * Math.cos(th); sp[si * 3 + 1] = d * u; sp[si * 3 + 2] = d * rr * Math.sin(th) - 20; }
    var sgeo = new THREE.BufferGeometry(); sgeo.setAttribute("position", new THREE.BufferAttribute(sp, 3));
    scene.add(new THREE.Points(sgeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.16, sizeAttenuation: true, transparent: true, opacity: 0.7, depthWrite: false })));
    var hc = document.createElement("canvas"); hc.width = hc.height = 256; var hx = hc.getContext("2d");
    var hg = hx.createRadialGradient(128, 128, 0, 128, 128, 128); hg.addColorStop(0, "rgba(255,240,205,.95)"); hg.addColorStop(0.07, "rgba(255,214,150,.75)"); hg.addColorStop(0.3, "rgba(255,160,90,.18)"); hg.addColorStop(1, "rgba(255,140,60,0)");
    hx.fillStyle = hg; hx.fillRect(0, 0, 256, 256);
    sun = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(hc), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
    sun.scale.set(16, 16, 1); scene.add(sun);
  }

  // Sphère pleine : cache les points de la face arrière (profondeur) et donne le volume.
  group.add(new THREE.Mesh(new THREE.SphereGeometry(1.985, 96, 64), new THREE.MeshBasicMaterial({ color: DAY ? 0xFBF4E8 : 0x07090b })));
  // Liseré discret sur le bord de la planète, couleur d'accent.
  var accent = new THREE.Color(COLOR);
  group.add(new THREE.Mesh(new THREE.SphereGeometry(2.06, 96, 64), new THREE.ShaderMaterial({
    uniforms: { col: { value: DAY ? new THREE.Color(0xC9B48F) : accent } }, side: THREE.BackSide, transparent: true, blending: DAY ? THREE.NormalBlending : THREE.AdditiveBlending, depthWrite: false,
    vertexShader: "varying vec3 vN; void main(){ vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
    fragmentShader: "uniform vec3 col; varying vec3 vN; void main(){ float i = pow(max(0.0, 0.58 - dot(normalize(vN), vec3(0.0, 0.0, 1.0))), 5.0); gl_FragColor = " + (DAY ? "vec4(col, min(1.0, i * 9.0) * 0.55)" : "vec4(col * i * 0.9, 1.0)") + "; }"
  })));

  // Terres en points : les continents sont rasterisés sur une petite carte, puis échantillonnés sur une grille régulière.
  var dotMat = new THREE.ShaderMaterial({
    uniforms: { scale: { value: 1 } }, transparent: true, depthWrite: false,
    vertexShader: "uniform float scale; varying float vF; void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); vF = dot(normalize(normalMatrix * position), vec3(0.0, 0.0, 1.0)); gl_PointSize = scale / -mv.z; gl_Position = projectionMatrix * mv; }",
    fragmentShader: "varying float vF; void main(){ vec2 p = gl_PointCoord - 0.5; if (dot(p, p) > 0.25) discard; float a = mix(0.18, 0.62, smoothstep(0.0, 0.8, vF)); gl_FragColor = vec4(" + (DAY ? "vec3(0.29, 0.38, 0.41)" : "vec3(0.62, 0.66, 0.68)") + ", a); }"
  });
  function addLand(topo) {
    var W = 1024, H = 512, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    var x = cv.getContext("2d"); x.fillStyle = "#fff";
    var land = topojson.feature(topo, topo.objects.land);
    var polys = land.geometry ? (land.geometry.type === "Polygon" ? [land.geometry.coordinates] : land.geometry.coordinates) : [];
    land.features && land.features.forEach(function (f) { polys = polys.concat(f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates); });
    [-360, 0, 360].forEach(function (shift) {
      x.beginPath();
      polys.forEach(function (poly) {
        poly.forEach(function (ring) {
          var prev = null;
          ring.forEach(function (p, i) {
            var lon = p[0];
            if (prev !== null) { while (lon - prev > 180) lon -= 360; while (prev - lon > 180) lon += 360; }
            prev = lon;
            var px = (lon + shift + 180) / 360 * W, py = (90 - p[1]) / 180 * H;
            if (i === 0) x.moveTo(px, py); else x.lineTo(px, py);
          });
          x.closePath();
        });
      });
      x.fill("evenodd");
    });
    var img = x.getImageData(0, 0, W, H).data, pts = [];
    function sample(step, la0, la1, keep) {
      for (var lat = la0; lat <= la1; lat += step) {
        var dl = step / Math.max(Math.cos(lat * Math.PI / 180), 0.2);
        for (var lon = -180; lon < 180; lon += dl) {
          var px = Math.floor((lon + 180) / 360 * W), py = Math.floor((90 - lat) / 180 * H);
          if (img[(py * W + px) * 4 + 3] > 128) { var v = vec(lon, lat, 2); if (keep(v)) pts.push(v.x, v.y, v.z); }
        }
      }
    }
    // Zone fine : calotte autour du centre du parcours (rayon angulaire « R »), le reste au pas normal.
    var R = SPAN + 0.6, c2 = mid.clone().multiplyScalar(2);
    var inCap = function (v) { return v.angleTo(c2) < R; };
    sample(1.35, -56, 80, function (v) { return !FINE || !inCap(v); });
    if (FINE) sample(0.35, -56, 80, inCap);
    var g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
    group.add(new THREE.Points(g, dotMat)); draw();
  }

  // Trajet : arcs en grand cercle entre des villes, légèrement surélevés au milieu.
  var PER = 90, path = [], stops = [];
  for (var c = 0; c < CITIES.length - 1; c++) {
    var a = vec(CITIES[c][0], CITIES[c][1], 1).normalize(), b = vec(CITIES[c + 1][0], CITIES[c + 1][1], 1).normalize();
    var ang = a.angleTo(b), lift = 0.08 + 0.32 * ang / Math.PI;
    if (TRIPV) lift = Math.min(lift, 0.6 * ang);
    stops.push(path.length);
    for (var i = 0; i <= PER; i++) {
      if (c > 0 && i === 0) continue;
      var t = i / PER, s = Math.sin(ang), wa = Math.sin((1 - t) * ang) / s, wb = Math.sin(t * ang) / s;
      var p = a.clone().multiplyScalar(wa).add(b.clone().multiplyScalar(wb)).normalize().multiplyScalar(2.012 + lift * Math.sin(Math.PI * t));
      path.push(p);
    }
  }
  stops.push(Math.max(0, path.length - 1));
  // Une seule ville : un point, pas de trajet.
  if (!path.length) { path.push(vec(CITIES[0][0], CITIES[0][1], 2.012)); stops = [0]; }
  var lineGeo = new THREE.BufferGeometry().setFromPoints(path);
  var lineMat = new THREE.LineBasicMaterial({ color: accent, transparent: true, opacity: 0.95 });
  var line = new THREE.Line(lineGeo, lineMat); group.add(line);

  function glow(size, alpha) {
    var cv = document.createElement("canvas"); cv.width = cv.height = 128; var x = cv.getContext("2d");
    var gr = x.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, DAY ? COLOR : "rgba(255,255,255," + alpha + ")"); gr.addColorStop(0.25, COLOR); gr.addColorStop(1, "rgba(0,0,0,0)");
    x.fillStyle = gr; x.fillRect(0, 0, 128, 128);
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), blending: DAY ? THREE.NormalBlending : THREE.AdditiveBlending, depthWrite: false, transparent: true }));
    sp.scale.set(size, size, 1); return sp;
  }
  var head = glow(0.34 * K * (TRIPV ? 1.4 : 1), 1); group.add(head);
  var marks = CITIES.map(function (ct) { var m = glow(0.16 * K, 0.9); m.position.copy(vec(ct[0], ct[1], 2.015)); m.visible = false; group.add(m); return m; });
  // Noms des villes du voyage (carte d'itinéraire) : pastilles posées à côté de chaque étape, masquées si elles se chevauchent.
  var labels = TRIPV ? CITIES.map(function (ct) {
    if (!ct[2]) return null;
    var el = document.createElement("div"); el.className = "lab"; el.textContent = ct[2];
    el.style.background = DAY ? "rgba(255,253,248,.92)" : "rgba(16,19,21,.85)"; el.style.color = DAY ? "#0E2A35" : "#F4EFE6";
    el.style.border = "1px solid " + (DAY ? "#D5C7A9" : "rgba(245,245,242,.18)");
    document.body.appendChild(el); return el;
  }) : [];
  var tmp = new THREE.Vector3();
  function placeLabels() {
    var w = window.innerWidth, h = window.innerHeight, boxes = [];
    labels.forEach(function (el, k) {
      if (!el) return;
      tmp.copy(marks[k].position); group.localToWorld(tmp); tmp.project(camera);
      var x = (tmp.x + 1) / 2 * w + 8, y = (1 - tmp.y) / 2 * h - 10, bw = el.offsetWidth, bh = el.offsetHeight;
      var hit = boxes.some(function (b) { return x < b[2] && x + bw > b[0] && y < b[3] && y + bh > b[1]; });
      var show = marks[k].visible && !hit && x > 0 && x + bw < w && y > 0 && y + bh < h;
      el.style.transform = "translate(" + Math.round(x) + "px," + Math.round(y) + "px)"; el.style.opacity = show ? "1" : "0";
      if (show) boxes.push([x, y, x + bw, y + bh]);
    });
  }

  // Orientation qui amène un point face à la caméra (lacet puis tangage), avec un léger décalage pour garder du relief.
  // Carte d'itinéraire : la planète reste tournée vers le centre du parcours, sans décalage.
  function aim(p) { var rho = Math.sqrt(p.x * p.x + p.z * p.z); return { y: Math.atan2(-p.x, p.z) + (TRIPV ? 0 : 0.35), x: Math.atan2(p.y, rho) - (TRIPV ? 0 : 0.18) }; }
  function wrap(d) { while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }

  var LEG = 2600, PAUSE = 450, END = TRIPV ? 5500 : 1800, FADE = 900, legs = CITIES.length - 1, cycle = legs * (LEG + PAUSE) + END + FADE, start = performance.now();
  function setProgress(n, opacity) {
    var idx = Math.max(1, Math.min(path.length, Math.round(n)));
    lineGeo.setDrawRange(0, idx); lineMat.opacity = 0.95 * opacity;
    head.position.copy(path[idx - 1]); head.material.opacity = opacity;
    marks.forEach(function (m, k) { m.visible = stops[k] < idx; m.material.opacity = opacity; });
    return path[idx - 1];
  }

  if (reduce) {
    setProgress(path.length, 1); var r0 = aim(TRIPV ? mid : path[stops[Math.min(2, stops.length - 1)]]); group.rotation.set(r0.x, r0.y, 0); head.visible = false;
  } else {
    var r1 = aim(path[0]); group.rotation.set(r1.x, r1.y, 0);
  }

  // Taille des points en pixels : ~0,02 unité vue à la distance de la caméra (champ de 36°).
  function draw() { dotMat.uniforms.scale.value = (FINE ? 0.009 : 0.034) * renderer.getPixelRatio() * window.innerHeight; renderer.render(scene, camera); if (labels && labels.length) placeLabels(); }
  var last = 0;
  function frame(now) {
    var dt = last ? Math.min(now - last, 100) : 16; last = now;
    if (!document.hidden) {
      // La première image peut arriver avec une heure antérieure au départ : on part de 0.
      var t = Math.max(0, now - start) % cycle, n, op = 1;
      if (t < legs * (LEG + PAUSE)) {
        var leg = Math.floor(t / (LEG + PAUSE)), lt = Math.min(1, (t - leg * (LEG + PAUSE)) / LEG);
        var e = lt < 0.5 ? 2 * lt * lt : 1 - Math.pow(-2 * lt + 2, 2) / 2;
        n = stops[leg] + 1 + e * (stops[leg + 1] - stops[leg]);
      } else {
        n = path.length;
        var ft = t - legs * (LEG + PAUSE) - END; if (ft > 0) op = 1 - ft / FADE;
      }
      // Itinéraire : en fin de trajet, la caméra recule et se tourne vers le centre du parcours (vue d'ensemble).
      var over = TRIPV && t >= legs * (LEG + PAUSE);
      var p = setProgress(n, Math.max(0, op)), r = aim(over ? mid : p);
      if (TRIPV) { zCur += (zFor(over ? VIEW : VIEWF) - zCur) * (1 - Math.exp(-dt / 700)); place(zCur); }
      // Suivi amorti, indépendant de la cadence d'affichage (≈ 0,4 s pour rattraper le point).
      var k = 1 - Math.exp(-dt / 400);
      group.rotation.y += wrap(r.y - group.rotation.y) * k;
      group.rotation.x += (r.x - group.rotation.x) * k;
      draw();
    }
    requestAnimationFrame(frame);
  }
  window.addEventListener("resize", resize); resize();
  if (!reduce) requestAnimationFrame(frame);
  if (window.topojson) fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json").then(function (r) { return r.json(); }).then(addLand).catch(function () {});
})();
</script></body></html>
